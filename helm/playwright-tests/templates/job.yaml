{{- if .Values.job.enabled }}
{{- /* Jobs are immutable, so each install/upgrade creates a new run named after the release revision. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%d" (include "playwright-tests.fullname" .) .Release.Revision }}
  labels:
    {{- include "playwright-tests.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  {{- with .Values.job.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  {{- with .Values.job.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    {{- include "playwright-tests.podTemplate" . | nindent 4 }}
{{- end }}
