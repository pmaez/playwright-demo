name: Playwright Tests

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:
    inputs:
      env:
        description: 'Test environment'
        required: false
        default: 'demo'
        type: choice
        options: [demo, dev, qa, uat]

env:
  TEST_ENV: ${{ github.event.inputs.env || 'demo' }}

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # The official image ships Node, all three browsers and their OS libraries, so the job
    # needs no browser download or apt-get install. Keep the tag in sync with
    # @playwright/test in package-lock.json and the Dockerfile (checked below).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7

      - name: Check Playwright image tags match package-lock.json
        run: |
          expected=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          status=0
          for f in Dockerfile .github/workflows/playwright.yml; do
            tags=$(grep -oE 'mcr\.microsoft\.com/playwright:v[0-9]+\.[0-9]+\.[0-9]+' "$f" | sed 's/.*:v//' | sort -u)
            if [ -z "$tags" ]; then
              echo "::error file=$f::No Playwright image tag found"
              status=1
            fi
            for tag in $tags; do
              if [ "$tag" != "$expected" ]; then
                echo "::error file=$f::Playwright image is v$tag but package-lock.json has @playwright/test $expected"
                status=1
              fi
            done
          done
          [ "$status" -eq 0 ] && echo "Image tags match @playwright/test $expected"
          exit $status

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests (PR)
        if: github.event_name == 'pull_request'
        run: npm run test:smoke
        env:
          CI: true

      - name: Run full suite (push / manual)
        if: github.event_name != 'pull_request'
        run: npm run test:all-browsers
        env:
          CI: true

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (traces, etc.)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
